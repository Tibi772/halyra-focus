    <radialGradient id="glow" cx="0.25" cy="1" r="0.9"><stop offset="0" stop-color="#ff9a3d" stop-opacity="0.42"/><stop offset="1" stop-color="#ff9a3d" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="1" cy="0" r="0.8"><stop offset="0" stop-color="#5a82ff" stop-opacity="0.45"/><stop offset="1" stop-color="#5a82ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="frost" cx="0.5" cy="0.08" r="0.95"><stop offset="0" stop-color="#cfe4ff" stop-opacity="0.26"/><stop offset="1" stop-color="#cfe4ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc85e"/><stop offset="1" stop-color="#ff6a2f"/></linearGradient>
