# Builds the website from website-src/ and publishes it on GitHub Pages
# (branch gh-pages). Free hosting at https://<user>.github.io/<repo>/.
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        run: node website-src/build.js site
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy website ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      # Tells Bing, DuckDuckGo and Yandex right away that the pages changed.
      # Google ignores IndexNow; for Google use Search Console (see docs/SEO.md).
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          KEY=$(node -p "require('./website-src/site.config.json').indexnow || ''")
          [ -n "$KEY" ] || exit 0
          DOMAIN=$(node -p "require('./website-src/site.config.json').domain || ''")
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          if [ -n "$DOMAIN" ]; then HOST="$DOMAIN"; BASE="https://$DOMAIN"; else HOST="$OWNER.github.io"; BASE="https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}"; fi
          URLS=$(grep -o '<loc>[^<]*</loc>' site/sitemap.xml | sed 's|</*loc>||g' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.stringify(s.trim().split(/\n/))))")
          curl -sS -m 30 -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json' \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"$BASE/$KEY.txt\",\"urlList\":$URLS}" \
            -w '\nIndexNow HTTP %{http_code}\n'
