# Builds the Mac (.dmg, universal) and Windows (.exe) installers on every push to
# main, runs the end-to-end self-test of the packaged app on real macOS and
# Windows machines, and publishes the installers as release v<package.json version>.
# The website's download buttons always point at the newest release.
name: Build, test & release

on:
  push:
    branches: [main]
    paths-ignore: ['website-src/**', '**.md', 'supabase/**', 'docs/**', '.github/workflows/supabase.yml', 'tools/verify-site.js', 'tools/test-webapp.js', '.github/workflows/verify.yml', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.js

  build:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Build macOS installer
        if: runner.os == 'macOS'
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win

      # The tab check needs "Halyra Focus may control Google Chrome" (macOS asks the
      # user once). On the CI machine nobody can click Allow, so pre-approve it.
      - name: Pre-approve browser control for the self-test (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          APP="dist/mac-universal/Halyra Focus.app"
          CHROME="/Applications/Google Chrome.app"
          req() { codesign -d -r- "$1" 2>&1 | sed -n 's/^designated => //p' > "$RUNNER_TEMP/req.txt"; csreq -r "$RUNNER_TEMP/req.txt" -b "$RUNNER_TEMP/req.bin" && xxd -p "$RUNNER_TEMP/req.bin" | tr -d '\n'; }
          CLIENT_REQ=$(req "$APP"); TARGET_REQ=$(req "$CHROME")
          echo "client req: ${#CLIENT_REQ} hex chars, target req: ${#TARGET_REQ} hex chars"
          for db in "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "/Library/Application Support/com.apple.TCC/TCC.db"; do
            sudo sqlite3 "$db" "DELETE FROM access WHERE service='kTCCServiceAppleEvents' AND client='com.halyra.focus';" || true
            sudo sqlite3 "$db" "INSERT INTO access (service, client, client_type, auth_value, auth_reason, auth_version, csreq, indirect_object_identifier_type, indirect_object_identifier, indirect_object_code_identity, flags, last_modified) VALUES ('kTCCServiceAppleEvents', 'com.halyra.focus', 0, 2, 3, 1, X'$CLIENT_REQ', 0, 'com.google.Chrome', X'$TARGET_REQ', 0, CAST(strftime('%s','now') AS INTEGER));" && echo "granted in $db" || echo "could not write $db"
          done
          sudo killall tccd 2>/dev/null || true; killall tccd 2>/dev/null || true

      # A failing self-test stops the release: a broken installer never reaches users.
      - name: End-to-end self-test (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 12
        run: |
          export HALYRA_SELFTEST_OUT="$RUNNER_TEMP/selftest"
          "dist/mac-universal/Halyra Focus.app/Contents/MacOS/Halyra Focus" --selftest
      - name: End-to-end self-test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 12
        shell: pwsh
        run: |
          $env:HALYRA_SELFTEST_OUT = Join-Path $env:RUNNER_TEMP 'selftest'
          $log = Join-Path $env:RUNNER_TEMP 'selftest-log.txt'
          $p = Start-Process -FilePath 'dist\win-unpacked\Halyra Focus.exe' -ArgumentList '--selftest' -Wait -PassThru -RedirectStandardOutput $log
          if (Test-Path $log) { Get-Content $log }
          Get-Content (Join-Path $env:HALYRA_SELFTEST_OUT 'results.json')
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-${{ runner.os }}
          path: ${{ runner.temp }}/selftest/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          ls -la out
          cat > notes.md <<NOTES
          **Halyra Focus** — free app & website blocker for Mac and Windows.

          - **Mac (Apple Silicon + Intel, macOS 12+):** HalyraFocus-mac.dmg
          - **Windows 10/11 (64-bit):** HalyraFocus-Setup.exe

          First launch — macOS: System Settings → Privacy & Security → *Open Anyway*. Windows: *More info* → *Run anyway*.
          NOTES
          gh release view "$V" >/dev/null 2>&1 || gh release create "$V" --title "Halyra Focus $V" --notes-file notes.md --latest
          gh release upload "$V" out/* --clobber
          gh release edit "$V" --latest --draft=false
