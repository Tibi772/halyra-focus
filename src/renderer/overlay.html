<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'">
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { background: transparent !important; overflow: hidden; }
    body::before, body::after { display: none !important; }
    .ov { position: absolute; inset: 10px; display: flex; align-items: center; gap: 16px; padding: 18px 22px; border-radius: 22px;
      background: var(--panel-solid); border: 1px solid var(--border-2); box-shadow: 0 18px 50px -12px rgba(0,0,0,.55);
      opacity: 0; transform: translateY(-14px) scale(.98); transition: opacity .35s var(--ease), transform .45s var(--ease); }
    .ov.show { opacity: 1; transform: none; }
    body[data-theme='crt'] .ov, body[data-theme='onebit'] .ov { border-radius: 0; }
    body[data-theme='onebit'] .ov { border: 2px solid #000; box-shadow: 4px 4px 0 #000; }
    .ov-icon { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; flex: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-ink); }
    body[data-theme='crt'] .ov-icon, body[data-theme='onebit'] .ov-icon { border-radius: 0; }
    .ov-icon svg { width: 26px; height: 26px; }
    .ov b { display: block; font-size: 17px; font-family: var(--font-display); letter-spacing: -.01em; }
    .ov span { color: var(--muted); font-size: 13px; }
    /* Christmas look: a red–green gift icon and a few soft lights along the top edge */
    .festive .ov-icon { background: linear-gradient(135deg, #e2394a, #b51f37); color: #fff; position: relative; }
    .festive .ov-icon::after { content: ''; position: absolute; left: 50%; top: 4px; bottom: 4px; width: 5px; margin-left: -2.5px; background: #ffd36b; border-radius: 3px; }
    .festive .ov-icon svg { position: relative; z-index: 1; }
    .festive .ov::before { content: ''; position: absolute; left: 24px; right: 24px; top: -3px; height: 6px; border-radius: 3px;
      background: radial-gradient(circle, #ff5d5d 0 2.5px, transparent 3px) 0 0/48px 6px, radial-gradient(circle, #ffd36b 0 2.5px, transparent 3px) 16px 0/48px 6px, radial-gradient(circle, #5fd0ff 0 2.5px, transparent 3px) 32px 0/48px 6px;
      animation: twinkle 2.4s ease-in-out infinite; }
    @keyframes twinkle { 50% { opacity: .45; } }
  </style>
</head>
<body data-theme="midnight">
  <div class="ov" id="ov">
    <div class="ov-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
    <div><b id="ov-t"></b><span id="ov-s"></span></div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
