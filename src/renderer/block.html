<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Halyra Focus</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="block.css">
</head>
<body data-theme="midnight" class="block-page">
  <main class="bp">
    <div class="bp-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64"><defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient></defs>
        <circle cx="32" cy="32" r="22" fill="none" stroke="url(#bg1)" stroke-width="6" stroke-dasharray="118 20" stroke-linecap="round" transform="rotate(-60 32 32)"/>
        <circle cx="32" cy="32" r="7" fill="url(#bg1)"/></svg>
    </div>
    <div class="bp-eyebrow" id="eyebrow"></div>
    <h1 class="bp-app" id="app"></h1>
    <div class="bp-until"><span id="until"></span> <span class="badge" id="mode"></span></div>
    <div class="bp-time" id="left"></div>
    <p class="bp-quote" id="quote"></p>
    <div class="bp-actions">
      <button class="btn primary" id="home"></button>
      <button class="btn" id="open"></button>
    </div>
  </main>
  <script src="block.js"></script>
</body>
</html>
